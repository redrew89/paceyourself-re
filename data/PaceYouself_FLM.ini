; Prototype FLM configuration - v1.2.2
; Populate safe location keywords into the PYS_ExtraTownKeywordFLST FormList
Group = SafeLocationKeywords|LocTypeGuild,LocTypeCastle,LocTypeBarracks,LocTypeFarm,LocTypeOrcStronghold,LocTypeSettlement,LocTypeMilitaryCamp,LocTypeCemetery,LocTypeDwelling

FormList = PYS_ExtraTownKeywordFLST|#SafeLocationKeywords

; Populate dungeon location keywords into PYS_ExtraDunKeywordFLST Formlist
Group = DungeonLocationKeywords|LocTypeBanditCamp,LocTypeDragonLair,LocTypeDragonPriestLair,LocTypeDraugrCrypt,LocTypeDwarvenAutomatons,LocTypeFalmerHive,LocTypeForswornCamp,LocTypeGiantCamp,LocTypeHagravenNest,LocTypeSprigganGrove,LocTypeShipwreck,LocTypeVampireLair,LocTypeWarlockLair,LocTypeWerewolfLair

FormList = PYS_ExtraDunKeywordFLST|#DungeonLocationKeywords


; Placeholder entries for additional FormLists, for walled towns with their own Worldspaces,
; and interior Worldspaces that are not flagged as interiors in the plugin data.
; These are pre-filled in the plugin, but additional Worldspaces can be added below.

; FormList = PYS_WalledTownWorldSpacesFLST|

; FormList = PYS_InteriorWorldspacesFLST|